version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
      - ~/.m2:/root/.m2
      - ./target:/workspace/target
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2"
    command: mvn spring-boot:run -Dspring-boot.run.fork=false